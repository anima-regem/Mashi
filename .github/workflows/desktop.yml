name: Check macOS desktop package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'mashi/**'
      - 'scripts/build_desktop.py'
      - 'scripts/smoke_desktop.py'
      - 'tests/test_desktop.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra desktop --extra dev --python 3.12
      - run: uv run --no-sync pytest -q tests/test_desktop.py
      - run: uv run --no-sync python scripts/build_desktop.py
      - run: uv run --no-sync python scripts/smoke_desktop.py --app dist/Mashi.app --output build/desktop-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-validation
          path: |
            build/desktop-smoke.json
            build/desktop-notices/inventory.json
            dist/Mashi-files.json
