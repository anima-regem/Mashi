name: Check skeleton
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-editable --extra dev --python 3.12
      - run: uv run --no-sync ruff check mashi tests
      - run: uv run --no-sync pytest -q
      - run: node --check mashi/static/app.js
