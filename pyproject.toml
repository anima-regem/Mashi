[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mashi-studio"
version = "0.1.0"
description = "A local-first Malayalam handwriting-to-font studio"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20",
  "pillow==11.2.1", "numpy==2.2.5", "opencv-python-headless==4.11.0.86",
  "vtracer==0.6.12", "ufoLib2==0.17.1", "fontmake==3.10.0", "fonttools==4.58.0",
  "setuptools==80.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.10", "uharfbuzz==0.49.0"]

[project.scripts]
mashi = "mashi.__main__:main"

[tool.setuptools]
packages = ["mashi"]

[tool.setuptools.package-data]
mashi = ["static/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
